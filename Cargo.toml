[package]
name = "wgsl_compute_shader"
version = "0.1.0"
authors = ["dashuai009 <dashuai009@gmail.com>"]
edition = "2024"
publish = false
license = "MIT"
description = "Real-time GPU XPBD Soft-Body Simulation with Bevy 0.20 and WGSL Compute Shaders"

[lib]
name = "wgsl_compute_shader"
path = "src/lib.rs"

[[bin]]
name = "wgsl_softbody"
path = "src/main.rs"

[dependencies]
bevy = { version = "0.20.1", default-features = false, features = [
    "std",
    "default_app",
    "ui_bevy_render",
    "bevy_ui_widgets",
    "ui_picking",
    "bevy_light",
    "bevy_pbr",
    "bevy_post_process",
    "bevy_anti_alias",
    "bevy_winit",
    "default_font",
    "tonemapping_luts",
    "zstd_rust",
    "keyboard",
    "mouse",
    "touch",
] }
bytemuck = { version = "1.25", features = ["derive"] }
nalgebra = "0.34"
anyhow = "1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { version = "0.20.1", default-features = false, features = [
    "multi_threaded",
    "x11",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.20.1", default-features = false, features = [
    "web",
    "webgpu",
] }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

[dev-dependencies]
wgpu = "30"
pollster = "0.4.0"
rand = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
strip = "debuginfo"
