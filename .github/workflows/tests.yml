name: Rust CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux graphics & Vulkan Lavapipe dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libudev-dev \
            mesa-vulkan-drivers

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Check native targets
        run: cargo check --all-targets

      - name: Build WASM WebGPU target
        run: cargo build --profile wasm-release --target wasm32-unknown-unknown --bin wgsl_softbody

      - name: Run GPU Signed-SVD & XPBD tests
        run: cargo test --release
